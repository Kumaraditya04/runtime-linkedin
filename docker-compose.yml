version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: leadradar_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    volumes:
      - ./backend/storage:/app/storage
    # Give the container some capability if Playwright needs it, though usually not needed for jammy image
    ipc: host

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: leadradar_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
